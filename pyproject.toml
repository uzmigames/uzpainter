[project]
name = "uzpainter-tools"
version = "0.0.0"
description = "UzPainter repository tooling (vendoring, sources and other checks)"
requires-python = ">=3.13"
dependencies = ["jsonschema>=4.25", "numpy>=2.4"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["thirdparty"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["tools", "tests"]
explicit_package_bases = true
exclude = ["^thirdparty/"]

[[tool.mypy.overrides]]
# jsonschema ships no type information (no py.typed) and its stubs are not installed.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Painter's runtime package: tools/parity/recorder/painter_side.py runs only inside Painter.
module = ["substance_painter", "substance_painter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# OpenEXR Python binding (BSD-3-Clause): decodes float exports in tools/parity/fit on the
# owner's machine only; it ships no type information.
module = ["OpenEXR"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# NVIDIA FLIP's Python package (BSD-3-Clause, N-FLIP): diagnostic metric of the render fits
# (tools/parity/render_fits) on the owner's machine only; it ships no type information.
module = ["flip_evaluator"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Windows UI automation of Painter's panels (tools/parity/recorder/painter_ui.py, decision 029):
# pywinauto, pywin32 and Pillow are dev-only dependencies on the owner's machine; hosted CI does
# not install them, and pywinauto and pywin32 ship no type information.
module = ["pywinauto", "pywinauto.*", "win32gui", "win32ui", "PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyYAML (tests reading the CI workflows) ships no type information; types-PyYAML is not installed.
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
