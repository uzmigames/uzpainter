name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:17 UTC: new advisories against unchanged pins.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit (CI tools and the shipped wheels)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      # The CI's own packages with everything they pull in (pip resolves them in a temporary venv).
      - name: Audit the CI packages (.github/ci-constraints.txt)
        run: python -m pip_audit -r .github/ci-constraints.txt

      # The wheel closure of the MCP SDK that ships beside UzPainter.exe. It is fully pinned in
      # thirdparty/python-wheels/MANIFEST.json, so it is audited as listed, without resolution.
      - name: Audit the shipped wheels (thirdparty/python-wheels)
        run: |
          python -c "import json; m = json.load(open('thirdparty/python-wheels/MANIFEST.json')); print('\n'.join(f\"{w['project']}=={w['version']}\" for w in m['wheels']))" > "$RUNNER_TEMP/shipped-wheels.txt"
          cat "$RUNNER_TEMP/shipped-wheels.txt"
          python -m pip_audit --disable-pip --no-deps -r "$RUNNER_TEMP/shipped-wheels.txt"

  repository-checks:
    name: Vendoring, licence, source and guard checks
    # Windows: tests/conftest.py sets the Windows error mode at session start.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      UZP_NO_GPU: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # The revision check reads the commits and blobs approved-sources.md pins.
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install the test packages
        run: python -m pip install -c .github/ci-constraints.txt pytest jsonschema numpy packaging

      # No private store here: the store-hash rule is skipped (and says so); the content and
      # schema rules run on every tracked and untracked file (parity/GUARD.md).
      - name: Repository guard
        run: python -m tools.parity.guard

      # Zig is not installed in this job, so the two cases that need a fresh build skip with
      # "zig is not on PATH"; tests.yml runs them with Zig. The doc-overlap cases skip without
      # Painter's public API documentation.
      - name: Vendoring check and source checks
        run: python -m pytest tests/vendoring/test_vendor_check.py tests/sources -p no:cacheprovider -rs
