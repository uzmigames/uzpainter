# CI lanes of docs/architecture/14-parity-testing.md §7 and parity/STORE.md §5.
# Hosted lane: no GPU, no private store; oracle comparisons there must report oracle_unavailable.
# Oracle lane: the owner's machine (self-hosted GPU runner with Painter 12.1.0 and
# UZP_PARITY_STORE), the only lane that compares against recorded Painter values. It runs only
# after the owner registers the runner and sets the repository variable UZP_GPU_RUNNER=registered,
# and never for pull requests.
name: Parity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted:
    name: Hosted CPU lane (no oracle store)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Tools
        run: python -m pip install jsonschema==4.25.1 pyyaml==6.0.3 ruff==0.14.3 mypy==1.20.1 pytest==9.1.1

      - name: Type-check
        run: python -m mypy

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest

      - name: Oracle comparisons without the store report oracle_unavailable
        shell: pwsh
        run: |
          $output = python -m tools.parity.store verify parity/schema/samples/public
          $code = $LASTEXITCODE
          $output
          if ($code -ne 1 -or -not ($output -match 'oracle_unavailable')) { exit 1 }
          exit 0

  oracle:
    name: Oracle lane (owner's machine, self-hosted GPU runner)
    if: vars.UZP_GPU_RUNNER == 'registered' && github.event_name != 'pull_request'
    runs-on: [ self-hosted, windows, x64, uzpainter-gpu ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Store integrity
        shell: pwsh
        run: python -m tools.parity.store verify

      - name: Every public manifest resolves from the store
        shell: pwsh
        run: |
          if (Test-Path parity/manifests) {
            python -m tools.parity.store verify parity/manifests
            exit $LASTEXITCODE
          }
