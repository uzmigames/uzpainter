[project]
name = "uzpainter-tools"
version = "0.0.0"
description = "UzPainter repository tooling (vendoring, sources and other checks)"
requires-python = ">=3.13"
dependencies = ["jsonschema>=4.25", "numpy>=2.4"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["thirdparty"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["tools", "tests", "adapters", "python/uzpainter_supervisor"]
explicit_package_bases = true
exclude = ["^thirdparty/"]

[[tool.mypy.overrides]]
# jsonschema ships no type information (no py.typed) and its stubs are not installed.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Painter's runtime package: tools/parity/recorder/painter_side.py runs only inside Painter.
module = ["substance_painter", "substance_painter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# UzPainter's embedded modules: adapters/assets3d/runner.py imports them only inside
# `UzPainter.exe run` (the native `uzpainter` and the facade's `uzpainter_facade`, python/).
module = ["uzpainter", "uzpainter.*", "uzpainter_facade", "uzpainter_facade.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# OpenEXR Python binding (BSD-3-Clause): decodes float exports in tools/parity/fit on the
# owner's machine only; it ships no type information.
module = ["OpenEXR"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# NVIDIA FLIP's Python package (BSD-3-Clause, N-FLIP): diagnostic metric of the render fits
# (tools/parity/render_fits) on the owner's machine only; it ships no type information.
module = ["flip_evaluator"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Windows UI automation of Painter's panels (tools/parity/recorder/painter_ui.py, decision 029):
# pywinauto, pywin32 and Pillow are dev-only dependencies on the owner's machine; hosted CI does
# not install them, and pywinauto and pywin32 ship no type information.
module = ["pywinauto", "pywinauto.*", "win32gui", "win32ui", "PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# SciPy (BSD-3-Clause): the linear-programming feasibility tests of
# tools/parity/vk_sampler_probe/texture_unit.py on the owner's machine only; scipy-stubs is not
# installed.
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The pinned MCP SDK and its HTTP server run only inside the embedded interpreter
# (thirdparty/python-wheels/, python/uzpainter_supervisor/main.py, transport_http.py); the
# development Python need not have them.
module = ["mcp", "mcp.*", "mcp_types", "mcp_types.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# PyYAML (tests reading the CI workflows) ships no type information; types-PyYAML is not installed.
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
