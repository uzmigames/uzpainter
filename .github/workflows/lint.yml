name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff check and ruff format --check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install -c .github/ci-constraints.txt ruff

      # Configuration: [tool.ruff] of pyproject.toml.
      - name: ruff check
        run: python -m ruff check --output-format=github .

      - name: ruff format --check
        run: python -m ruff format --check .
