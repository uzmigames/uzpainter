name: Type-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: mypy (strict, pyproject files)
    # Windows: the code calls Windows-only APIs (ctypes.WinDLL, subprocess.CREATE_NEW_PROCESS_GROUP),
    # which mypy types only for platform win32 (on Linux it reports 56 attr-defined errors).
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      # The typed imports of the checked files: numpy, pytest (tests) and packaging
      # (tools/vendoring/wheels.py). jsonschema, yaml, PIL and the owner-machine-only packages are
      # ignore_missing_imports in pyproject.toml, so they are not installed.
      - name: Install mypy and the typed imports
        run: python -m pip install -c .github/ci-constraints.txt mypy numpy pytest packaging

      # No arguments: [tool.mypy] files of pyproject.toml.
      - name: mypy
        run: python -m mypy
