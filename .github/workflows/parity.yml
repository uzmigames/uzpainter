# Hosted CI of docs/architecture/14-parity-testing.md §7 and parity/STORE.md §5.
# GitHub runs hosted CPU-only jobs (decision 028): no GPU, no self-hosted runner, no private
# store. Oracle comparisons there must report oracle_unavailable; tests that need a DX12/Vulkan
# adapter skip under UZP_NO_GPU=1. GPU and Painter-oracle checks run locally on the owner's machine.
name: Parity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted:
    name: Hosted CPU lane (no GPU, no oracle store)
    runs-on: windows-latest
    env:
      UZP_NO_GPU: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Zig (pinned, build.zig.zon)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Tools
        run: python -m pip install jsonschema==4.25.1 pyyaml==6.0.3 ruff==0.14.3 mypy==1.20.1 pytest==9.1.1

      - name: Repository guard (parity/GUARD.md; no store here, content and schema rules)
        run: python -m tools.parity.guard

      - name: Vendoring check (13-engine-integration.md §3.3)
        run: python -m tools.vendoring.vendor_check

      - name: Type-check
        run: python -m mypy

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest

      - name: Oracle comparisons without the store report oracle_unavailable
        shell: pwsh
        run: |
          $output = python -m tools.parity.store verify parity/schema/samples/public
          $code = $LASTEXITCODE
          $output
          if ($code -ne 1 -or -not ($output -match 'oracle_unavailable')) { exit 1 }
          exit 0
